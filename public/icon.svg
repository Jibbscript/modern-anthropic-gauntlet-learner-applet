<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6dff"/>
      <stop offset="1" stop-color="#4b5bff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>
  <!-- three rising blocks: the levels of the gauntlet -->
  <rect x="104" y="292" width="88" height="116" rx="22" fill="#fff" opacity=".72"/>
  <rect x="212" y="214" width="88" height="194" rx="22" fill="#fff" opacity=".86"/>
  <rect x="320" y="128" width="88" height="280" rx="22" fill="#fff"/>
  <circle cx="364" cy="96" r="18" fill="#ffd02b"/>
</svg>
